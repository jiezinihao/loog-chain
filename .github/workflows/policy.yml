name: policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-source:
    name: release-source
    runs-on: ubuntu-latest
    steps:
      - name: 校验发布分支来源
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^release/[^/]+$ ]]; then
            echo "::error::main 只接受来自 release/<版本号> 分支的拉取请求，当前来源为 $HEAD_BRANCH"
            exit 1
          fi

          echo "来源分支 $HEAD_BRANCH 符合发布规则"
